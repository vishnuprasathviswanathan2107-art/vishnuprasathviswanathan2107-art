  <text x="640" y="130" fill="#f9a8d4" font-family="ui-monospace, monospace" font-size="10.5">Apex Controllers (MVC)</text>

  <rect class="layer-3" x="595" y="148" width="240" height="28" rx="6" fill="#160c1d" stroke="#4c1d3d" stroke-width="1" />
  <circle class="dot-3" cx="611" cy="162" r="3" fill="#f472b6" />
  <text x="640" y="166" fill="#c4b1bc" font-family="ui-monospace, monospace" font-size="10.5">SOQL / Faculty Records</text>
