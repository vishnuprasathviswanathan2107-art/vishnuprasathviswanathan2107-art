<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 235" width="900" height="235">
  <defs>
    <radialGradient id="p2Glow" cx="85%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#9d174d" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0d0910" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .layer-1 { animation: layerPulse 3.6s ease-in-out infinite 0s; }
    .layer-2 { animation: layerPulse 3.6s ease-in-out infinite 1.2s; }
    .layer-3 { animation: layerPulse 3.6s ease-in-out infinite 2.4s; }
    .dot-1 { animation: dotActive 3.6s ease-in-out infinite 0s; }
    .dot-2 { animation: dotActive 3.6s ease-in-out infinite 1.2s; }
    .dot-3 { animation: dotActive 3.6s ease-in-out infinite 2.4s; }

    @keyframes layerPulse {
      0%, 100% { stroke: #4c1d3d; stroke-width: 1; }
      33% { stroke: #f472b6; stroke-width: 1.8; }
    }
    @keyframes dotActive {
      0%, 100% { opacity: 0.25; }
      33% { opacity: 1; }
    }
  </style>

  <rect width="900" height="235" rx="16" fill="#0d0910" stroke="#33182c" stroke-width="1.5" />
  <rect width="900" height="235" rx="16" fill="url(#p2Glow)" />

  <text x="36" y="40" fill="#c08497" font-family="ui-monospace, monospace" font-size="10.5" letter-spacing="1.5">02 · ENTERPRISE · MVC · DATA WORKFLOWS</text>
  <text x="36" y="78" fill="#ffffff" font-family="Georgia, serif" font-size="30" font-weight="700">Campus360</text>
  <text x="36" y="104" fill="#b8a1af" font-family="system-ui, sans-serif" font-size="13">Faculty management system streamlining academic administration workflows.</text>

  <text x="36" y="148" fill="#ffffff" font-family="Georgia, serif" font-size="19" font-weight="700">MVC</text>
  <text x="36" y="166" fill="#8e7484" font-family="system-ui, sans-serif" font-size="11">clean architecture</text>

  <text x="165" y="148" fill="#ffffff" font-family="Georgia, serif" font-size="19" font-weight="700">SOQL</text>
  <text x="165" y="166" fill="#8e7484" font-family="system-ui, sans-serif" font-size="11">optimized data queries</text>

  <text x="315" y="148" fill="#ffffff" font-family="Georgia, serif" font-size="19" font-weight="700">SFDX</text>
  <text x="315" y="166" fill="#8e7484" font-family="system-ui, sans-serif" font-size="11">source-driven deploys</text>

  <g font-family="ui-monospace, monospace" font-size="10.5" fill="#e5d9e0">
    <rect x="36" y="188" width="84" height="22" rx="6" fill="#1d1024" stroke="#4c1d3d" />
    <text x="47" y="203">Salesforce</text>
    <rect x="128" y="188" width="52" height="22" rx="6" fill="#1d1024" stroke="#4c1d3d" />
    <text x="140" y="203">Apex</text>
    <rect x="188" y="188" width="46" height="22" rx="6" fill="#1d1024" stroke="#4c1d3d" />
    <text x="200" y="203">LWC</text>
    <rect x="242" y="188" width="52" height="22" rx="6" fill="#1d1024" stroke="#4c1d3d" />
    <text x="254" y="203">SOQL</text>
    <rect x="302" y="188" width="42" height="22" rx="6" fill="#1d1024" stroke="#4c1d3d" />
    <text x="313" y="203">Git</text>
  </g>

  <rect x="570" y="42" width="290" height="150" rx="12" fill="#140b18" fill-opacity="0.8" stroke="#4c1d3d" stroke-width="1" />
  <text x="590" y="64" fill="#c08497" font-family="ui-monospace, monospace" font-size="9.5" letter-spacing="1.2">SYSTEM LAYERS</text>

  <rect class="layer-1" x="595" y="76" width="240" height="28" rx="6" fill="#24112c" stroke="#f472b6" stroke-width="1" />
