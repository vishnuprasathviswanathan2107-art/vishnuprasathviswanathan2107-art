  <text x="645" y="94" fill="#ffffff" font-family="ui-monospace, monospace" font-size="10.5">LWC Admin Portals</text>

  <rect class="layer-2" x="595" y="112" width="240" height="28" rx="6" fill="#1c0f24" stroke="#9d174d" stroke-width="1" />
