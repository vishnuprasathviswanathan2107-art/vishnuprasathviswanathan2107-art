<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250">
  <defs>
    <radialGradient id="proofGlow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#0d0910" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="proofShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#f472b6" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <clipPath id="proofClip">
      <rect width="900" height="250" rx="16" />
    </clipPath>
  </defs>

  <style>
    .wm-pulse { animation: wmBreathe 4s ease-in-out infinite; }
    .shimmer { animation: sweepProof 7s ease-in-out infinite; }
    .s1 { animation: statGlow 5s ease-in-out infinite 0s; }
    .s2 { animation: statGlow 5s ease-in-out infinite 1s; }
    .s3 { animation: statGlow 5s ease-in-out infinite 2s; }
    .s4 { animation: statGlow 5s ease-in-out infinite 3s; }
    .s5 { animation: statGlow 5s ease-in-out infinite 4s; }

    @keyframes wmBreathe {
      0%, 100% { fill-opacity: 0.16; }
      50% { fill-opacity: 0.34; }
    }
    @keyframes sweepProof {
      0% { transform: translateX(-300px) skewX(-20deg); }
      40%, 100% { transform: translateX(1150px) skewX(-20deg); }
    }
    @keyframes statGlow {
      0%, 100% { stroke: #2d1627; stroke-width: 1; }
      20% { stroke: #f472b6; stroke-width: 1.5; }
    }
  </style>

  <g clip-path="url(#proofClip)">
    <rect width="900" height="250" rx="16" fill="#0d0910" />
    <rect width="900" height="250" rx="16" fill="url(#proofGlow)" />
    <rect class="shimmer" x="0" y="0" width="200" height="250" fill="url(#proofShimmer)" />
  </g>
  <rect width="900" height="250" rx="16" fill="none" stroke="#2d1627" stroke-width="1.5" />

  <rect x="18" y="18" width="424" height="122" rx="12" fill="#160d1b" fill-opacity="0.88" stroke="#3d1c34" stroke-width="1" />
  <text class="wm-pulse" x="275" y="88" fill="#be185d" font-family="Georgia, serif" font-size="72" font-weight="700">91%</text>
  <text x="38" y="48" fill="#f472b6" font-family="system-ui, sans-serif" font-size="10" letter-spacing="1.8" font-weight="600">SALESFORCE CREDENTIAL</text>
  <text x="38" y="84" fill="#ffffff" font-family="Georgia, serif" font-size="24" font-weight="700">Platform Developer I</text>
  <text x="38" y="112" fill="#9c8392" font-family="system-ui, sans-serif" font-size="12">Certified Feb 2026 · Apex, LWC, Relational Models</text>

  <rect x="458" y="18" width="424" height="122" rx="12" fill="#160d1b" fill-opacity="0.88" stroke="#3d1c34" stroke-width="1" />
  <text class="wm-pulse" x="680" y="88" fill="#be185d" font-family="Georgia, serif" font-size="64" font-weight="700">1400+</text>
  <text x="478" y="48" fill="#f472b6" font-family="system-ui, sans-serif" font-size="10" letter-spacing="1.8" font-weight="600">COMPETITIVE PROGRAMMING</text>
  <text x="478" y="84" fill="#ffffff" font-family="Georgia, serif" font-size="24" font-weight="700">CodeChef 1400+ Rating</text>
  <text x="478" y="112" fill="#9c8392" font-family="system-ui, sans-serif" font-size="12">Active DSA + algorithmic problem solver · LeetCode</text>

  <g>
    <rect class="s1" x="18" y="154" width="162" height="78" rx="10" fill="#130b17" stroke="#2d1627" stroke-width="1" />
    <text x="34" y="180" fill="#c08497" font-family="system-ui, sans-serif" font-size="9.5" letter-spacing="1.2">ACADEMICS</text>
    <text x="34" y="212" fill="#ffffff" font-family="Georgia, serif" font-size="24" font-weight="700">7.43</text>
    <text x="90" y="212" fill="#8e7484" font-family="system-ui, sans-serif" font-size="11">CGPA</text>

    <rect class="s2" x="193" y="154" width="162" height="78" rx="10" fill="#130b17" stroke="#2d1627" stroke-width="1" />
    <text x="209" y="180" fill="#c08497" font-family="system-ui, sans-serif" font-size="9.5" letter-spacing="1.2">SALESFORCE PD1</text>
    <text x="209" y="212" fill="#ffffff" font-family="Georgia, serif" font-size="24" font-weight="700">91%</text>
    <text x="266" y="212" fill="#8e7484" font-family="system-ui, sans-serif" font-size="11">Score</text>

    <rect class="s3" x="368" y="154" width="164" height="78" rx="10" fill="#130b17" stroke="#2d1627" stroke-width="1" />
    <text x="384" y="180" fill="#c08497" font-family="system-ui, sans-serif" font-size="9.5" letter-spacing="1.2">CODECHEF</text>
    <text x="384" y="212" fill="#ffffff" font-family="Georgia, serif" font-size="24" font-weight="700">1400+</text>
    <text x="458" y="212" fill="#8e7484" font-family="system-ui, sans-serif" font-size="11">Rating</text>

    <rect class="s4" x="545" y="154" width="162" height="78" rx="10" fill="#130b17" stroke="#2d1627" stroke-width="1" />
    <text x="561" y="180" fill="#c08497" font-family="system-ui, sans-serif" font-size="9.5" letter-spacing="1.2">POSTGRESQL (IITB)</text>
    <text x="561" y="212" fill="#ffffff" font-family="Georgia, serif" font-size="24" font-weight="700">90%</text>
    <text x="618" y="212" fill="#8e7484" font-family="system-ui, sans-serif" font-size="11">Score</text>

    <rect class="s5" x="720" y="154" width="162" height="78" rx="10" fill="#130b17" stroke="#2d1627" stroke-width="1" />
    <text x="736" y="180" fill="#c08497" font-family="system-ui, sans-serif" font-size="9.5" letter-spacing="1.2">JAVA (IITB)</text>
    <text x="736" y="212" fill="#ffffff" font-family="Georgia, serif" font-size="24" font-weight="700">85%</text>
    <text x="793" y="212" fill="#8e7484" font-family="system-ui, sans-serif" font-size="11">Score</text>
  </g>
</svg>
