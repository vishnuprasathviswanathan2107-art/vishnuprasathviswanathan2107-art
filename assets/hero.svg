<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270">
  <defs>
    <radialGradient id="glow" cx="80%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.5" />
      <stop offset="55%" stop-color="#500724" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0d0910" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b214f" />
      <stop offset="100%" stop-color="#271222" />
    </linearGradient>
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#f472b6" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <clipPath id="heroClip">
      <rect width="900" height="270" rx="16" />
    </clipPath>
  </defs>

  <style>
    .pulse-glow { animation: glowPulse 5s ease-in-out infinite; }
    .float-card { animation: floatY 4.5s ease-in-out infinite; }
    .dot-blink { animation: dotPulse 1.8s ease-in-out infinite; }
    .shimmer-bar { animation: sweep 6s ease-in-out infinite; }
    .fade-up-1 { animation: fadeIn 0.8s ease-out forwards; }
    .fade-up-2 { animation: fadeIn 1.2s ease-out forwards; }

    @keyframes glowPulse {
      0%, 100% { opacity: 0.75; }
      50% { opacity: 1; }
    }
    @keyframes floatY {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes dotPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
    @keyframes sweep {
      0% { transform: translateX(-350px) skewX(-20deg); }
      45%, 100% { transform: translateX(1150px) skewX(-20deg); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>

  <g clip-path="url(#heroClip)">
    <rect width="900" height="270" rx="16" fill="#0d0910" />
    <rect class="pulse-glow" width="900" height="270" rx="16" fill="url(#glow)" />
    <rect class="shimmer-bar" x="0" y="0" width="220" height="270" fill="url(#shimmer)" />
  </g>
  <rect width="900" height="270" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <rect x="44" y="28" width="215" height="24" rx="12" fill="#1a0f1d" stroke="#3b1d33" stroke-width="1" />
  <circle class="dot-blink" cx="58" cy="40" r="3.5" fill="#f472b6" />
  <text x="70" y="44" fill="#d1b3c4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">~/vishnu / home — dev</text>

  <text class="fade-up-1" x="44" y="86" fill="#c08497" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" letter-spacing="1.8" font-weight="600">SYSTEM ARCHITECTURE · DATA SCIENCE · JAVA · SALESFORCE</text>

  <text class="fade-up-1" x="44" y="142" fill="#ffffff" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="48" font-weight="700">Vishnu Prasath</text>
  <text class="fade-up-2" x="44" y="192" fill="#f472b6" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="44" font-style="italic">V.</text>

  <text class="fade-up-2" x="44" y="232" fill="#a893a0" font-family="system-ui, -apple-system, sans-serif" font-size="14">Building scalable backends, data-driven apps, and Salesforce systems.</text>

  <g class="float-card">
    <rect x="635" y="38" width="225" height="194" rx="14" fill="#140c18" fill-opacity="0.9" stroke="#5b2149" stroke-width="1.2" />
    <circle cx="656" cy="58" r="4" fill="#f43f5e" />
    <circle cx="670" cy="58" r="4" fill="#f59e0b" />
    <circle cx="684" cy="58" r="4" fill="#10b981" />
    <line x1="635" y1="74" x2="860" y2="74" stroke="#2d1627" stroke-width="1" />

    <text x="655" y="102" fill="#f472b6" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1">STATUS</text>
    <text x="655" y="122" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">B.Tech IT '27</text>

    <text x="655" y="152" fill="#f472b6" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1">CERTIFICATION</text>
    <text x="655" y="172" fill="#e2d4dc" font-family="system-ui, sans-serif" font-size="13">Salesforce PD1 (91%)</text>

    <text x="655" y="202" fill="#f472b6" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1">LOCATION</text>
    <text x="655" y="220" fill="#a893a0" font-family="system-ui, sans-serif" font-size="12">Coimbatore, Tamil Nadu</text>
  </g>
</svg>
